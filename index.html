<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>Music Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#0a0a0a;color:#fff;padding:16px;padding-bottom:140px}
h1{font-size:20px;margin-bottom:4px}
p{color:#888;font-size:13px;margin-bottom:16px}
input{display:none}
button{background:#1db954;color:#fff;border:none;padding:10px 16px;border-radius:20px;font-size:14px;cursor:pointer;margin:0 8px 8px 0}
button:nth-child(2){background:#333}
#list{margin-top:12px}
.song{display:flex;align-items:center;padding:12px;background:#1a1a1a;border-radius:10px;margin-bottom:8px;cursor:pointer}
.song:active{transform:scale(.98)}
.song.active{background:#1db954;color:#000}
.song img{width:48px;height:48px;border-radius:6px;object-fit:cover;margin-right:12px;background:#333}
.song span{font-size:14px;word-break:break-all}
#bar{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;padding:12px 16px}
#now{font-size:12px;color:#888;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
audio{width:100%;height:36px}
</style>
</head>
<body>
<h1>🎵 Offline Music</h1>
<p>Select files from your Google Drive sync folder. Works 100% offline.</p>
<input type="file" id="s" accept="audio/*" multiple>
<input type="file" id="a" accept="image/*" multiple>
<button onclick="s.click()">➕ Songs</button>
<button onclick="a.click()">🖼 Art</button>
<div id="list"></div>
<div id="bar"><div id="now">Tap song to play</div><audio id="p" controls></audio></div>

<script type="module">
import{get,set,keys}from'https://cdn.jsdelivr.net/npm/idb-keyval@6/+esm';
const $=x=>document.getElementById(x),q=x=>document.querySelector(x),p=$('p'),l=$('list'),n=$('now');
let c=null;

// Load saved songs on startup
const all=await keys(),songKeys=all.filter(k=>k.startsWith('s_'));
for(const k of songKeys)render(await get(k));

// Add new songs
s.onchange=async e=>{for(const f of e.target.files){const d=await f.arrayBuffer();await set('s_'+f.name,{n:f.name,t:f.type,d});render({n:f.name,t:f.type,d})}};

// Add art (auto-matches if filename matches song name, e.g., "song.mp3" + "song.jpg")
a.onchange=async e=>{for(const f of e.target.files){const d=await f.arrayBuffer(),b=f.name.replace(/\.[^.]+$/,'');await set('a_'+b,d);const i=q(`[data-b="${b}"] img`);if(i)i.src=URL.createObjectURL(new Blob([d]))}};

function render(s){
  const x=document.createElement('div');
  x.className='song';x.dataset.b=s.n.replace(/\.[^.]+$/,'');
  x.innerHTML=`<img src=""><span>${s.n}</span>`;
  x.onclick=()=>{c&&c.classList.remove('active');c=x;x.classList.add('active');n.textContent='▶ '+s.n;p.src=URL.createObjectURL(new Blob([s.d],{type:s.t}));p.play()};
  l.appendChild(x);
  get('a_'+x.dataset.b).then(d=>d&&(x.querySelector('img').src=URL.createObjectURL(new Blob([d]))));
}

// Offline app shell (so the website itself loads without internet)
if('serviceWorker'in navigator){
  const code=`self.addEventListener('install',e=>{e.waitUntil(caches.open('v1').then(c=>c.addAll(['/'])));self.skipWaiting()});self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))))`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([code],{type:'text/javascript'})));
}
</script>
</body>
</html>
